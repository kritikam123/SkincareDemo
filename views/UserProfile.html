<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/styles/UserProfile.css">
</head>
    <title>User Profile</title>
</head>
<body>
    <div class="profile-box">
        <div class="profile-header">
            <div class="profile-img">
                <img src="/src/assets/profile.png" alt="user">
            </div>
            <div class="profile-name">
                <h4>Name</h4>
                <p>name@gmail.com</p>
            </div>
        </div>
        <hr>
        <div class="profile-body">
            <form class="form" id="user-info">
                <div class="userName">
                    <label>Name</label>
                    <input type="text" placeholder="your name" id="username">
                </div>
                <div class="userEmail">
                    <label>Email account</label>
                    <input type="email" placeholder="yourmail@gmail.com" id="userEmail">
                </div>
                <div class="userPhone">
                    <label>Mobile Number</label>
                    <input type="text" placeholder="Add number" id="userPhone">
                </div>
                <div class="userLocation">
                    <label>Location</label>
                    <input type="text" placeholder="Nepal" id="userLocation">
                </div>
                <div class="button">
                    <button type="submit">Save changes</button>
                </div>

            </form>
        </div>
    </div>
    
</body>
</html>
