<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/global/css/navbar.css">
    <link rel="stylesheet" href="/pages/user/profile/profile.css">

    <title>Profile</title>
</head>
<body>
<nav class="my-navbar">
    <div class="logo">
        <a href="/pages/user/user.html">
            <h2>Minimalist</h2>
        </a>
    </div>
  

    <div class="nav-right">
        <a href="/pages/user/profile/profile.html" class="icon">
            <i class="fa-solid fa-user"></i>
        </a>
        <a href="#" class="icon" id="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </div>
    <div class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
    </div>
</nav>
<div class="profile-wrap">
    <div class="row-header">
        <h2 id="user-name">Name</h2>
        <button class="pill-btn" id="edit-btn">Edit</button>
    </div>
    <div class="card">
        <div class="card-row">
            <span class="label">Email</span>
            <span class="value" id="user-email">-</span>
        </div>
    </div>
    <div class="card">
        <div class="card-row">
            <span class="label">Phone</span>
            <span class="value" id="user-phone">-</span>
        </div>
    </div>

    <div class="row-header">
        <h2>Addresses</h2>
        <button class="pill-btn" id="add-address-btn">Add</button>
    </div>

    <div class="card">
        <div class="address-row" id="address-row">
            <span class="value muted" id="address-text">No address added</span>
        </div>
    </div>
</div>
<script src="/pages/user/profile/profile.js"></script>
</body>
</html>
