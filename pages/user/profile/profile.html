<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/global/css/navbar.css">
    <link rel="stylesheet" href="/pages/user/profile/profile.css">

    <title>Profile</title>
</head>
<body>
<nav class="my-navbar">
    <div class="logo">
        <a href="/pages/user/user.html">
            <h2>Minimalist</h2>
        </a>
    </div>
  

    <div class="nav-right">
        <a href="/pages/user/profile/profile.html" class="log-icon">
            <i class="fa-solid fa-user"></i>
        </a>
        <a href="#" class="log-icon" id="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </div>
    <div class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
    </div>
</nav>

<div class="profile-wrap">
    <a href="/pages/user/user.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to home
    </a>

    <div class="profile-header">
        <div class="user-info">
            <h2 id="user-name">-</h2>
            <p class="subtitle">Personal account</p>
        </div>
    </div>
</div>

<div class="card contact-card">
    <div class="card-row">
        <div class="label-group">
           <i class="fa-regular fa-envelope icon"></i>
            <span class="label">Email</span> 
        </div>
        <span class="value" id="user-email">-</span>
    </div>
    <div class="divider">
        <div class="card-row">
            <div class="label-group">
               <i class="fa-solid fa-phone icon"></i>
                <span class="label">Phone</span> 
            </div>
            <span class="value" id="user-phone">-</span>
        </div>
    </div>

    <div class="row-header">
        <h2>Address</h2>
    </div>

    <div class="card address-card">
      <div class="empty-address" id="empty-address-view">
            <div class="icon-circle">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <h4>No addresses yet</h4>
      </div>
      <div class="address-display" id="address-display" style="display: none;">
            <span class="value" id="address-text">-</span>
        </div>

    </div>

</div>

<script src="/pages/user/profile/profile.js"></script>
<script src="/global/js/auth/logout.js"></script>
</body>
</html>
