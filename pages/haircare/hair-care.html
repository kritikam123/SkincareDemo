<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
       <link rel="stylesheet" href="/global/css/collections.css">
    <link rel="stylesheet" href="/global/css/products.css">
    <link rel="stylesheet" href="/global/css/navbar.css">
    <title>Minimalist | Collections</title>

</head>

<body>
<nav class="my-navbar">

   <div class="logo">
       <a href="/pages/home/index.html">
            <h2>Minimalist</h2>
        </a>
    </div>

  <ul class="nav-links">
        <li><a href="/pages/shop/shop.html">Shop</a></li>
        <li><a href="/pages/best-sellers/best-sellers.html">Best Sellers</a></li>
        <li><a href="/pages/skincare/skin-care.html">Skin Care</a></li>
        <li><a href="/pages/haircare/hair-care.html">Hair Care</a></li>
        <li><a href="#">Baby Care</a></li>
    </ul>


    <div class="nav-right">

        <a href="#" class="cart-icon" id="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </a>
        <a href="/pages/auth/login/login.html" class="icon">
            <i class="fa-solid fa-user"></i>
        </a>
    </div>
    <div class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
    </div>
</nav>

<header class="collection-header">
    <h1>Hair Care</h1>
</header>

<div class="collection-layout">
<aside class="filter-sidebar" id="filter-sidebar">
    <div class="filter-sidebar-header">
        <h3>Filter</h3>
        <button id="clear-filters">Clear</button>
    </div>
    <div class="filter-group">
        <h4>Category</h4>
        <label><input type="checkbox" class="filter-concern" value="Acne"> Acne</label>
        <label><input type="checkbox" class="filter-concern" value="Dullness"> Dullness</label>
        <label><input type="checkbox" class="filter-concern" value="Dryness"> Dryness</label>
        <label><input type="checkbox" class="filter-concern" value="Pigmentation"> Pigmentation</label>
        <label><input type="checkbox" class="filter-concern" value="Aging"> Aging</label>
        <label><input type="checkbox" class="filter-concern" value="Sun Protection"> Sun Protection</label>
        <label><input type="checkbox" class="filter-concern" value="Hair Fall"> Hair Fall</label>
        <label><input type="checkbox" class="filter-concern" value="Dandruff"> Dandruff</label>
    </div>

    <div class="filter-group">
        <h4>Price</h4>
        <div class="price-inputs">
            <input type="number" id="price-min" placeholder="Min">
            <span>&ndash;</span>
            <input type="number" id="price-max" placeholder="Max">
        </div>
    </div>

    <div class="filter-group">
        <h4>Availability</h4>
        <label><input type="checkbox" class="filter-availability" value="Instock"> In stock</label>
        <label><input type="checkbox" class="filter-availability" value="Outofstock"> Out of stock</label>
    </div>
</aside>

<!-- //products -->
 <div class="product-main">
    <div class="product-toolbar">
        <button class="mobile-filter-btn" id="open-filter-sidebar">
            <i class="fa-solid fa-sliders"></i>Filter
        </button>
        <p id="results-count">Showing products</p>

        <div class="sort-wrapper">
            <label for="sort-select"> Sort by</label>
            <select id="sort-select">
                <option value="featured">Featured</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name-az">Name: A-Z</option>
                    <option value="name-za">Name: Z-A</option>
            </select>
        </div>
    </div>

    <div class="products" id="products-container">
        <p class="no-result" id="no-result" style="display: none;">
            No products match your filter. 

        </p>
    </div>
    <div class="pagination" id="pagination"></div>
 </div>

 <!-- cart drawer -->
<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-header">
        <h3>Your Cart</h3>
        <button id="close-cart">&times;</button>
    </div>
    <ul class="cart-items" id="cart-items"></ul>
    <div class="cart-footer">
        <p id="cart-total">Total: रु.0</p>
        <button class="checkout-btn">Checkout</button>
    </div>
</aside>

<script src="/global/js/products/products-loader.js"></script>
<script src="/global/js/products/pagination.js"></script>
<script src="/global/js/products/filters.js"></script>
<script src="/pages/haircare/hair-care.js"></script>
<script src="/global/js/nav/navbar.js"></script>
<script src="/global/js/cart/cart.js"></script>
</body>
</html>
