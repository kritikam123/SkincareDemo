<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/pages/auth/login/login.css">
</head>
<body>
    <div class="login_container">
        <div class="login_box">
            <h1> Minimalist</h1>
             <p>Welcome Back! <br>Please enter your details to continue</p>

            <form class="form" id="loginForm">
                <div class="email">
                <label>Email </label>
                <input type="email" id="loginEmail" required>
                </div>
                <div class="password">
                <label>Password</label>
                <input type="password" id="loginPassword" required>
                <span class="error-text" id="loginError"></span>
                </div>
                <div class="box">
                <label>
                 <input type="checkbox" id="rememberMe">
                Remember me 
                </label>
                <a href="#">Forgot Password</a>
                </div>
            
                <div class="button">
                    
                <button type="submit">Login</button>
                </div>
        
            </form>

            <div class="extra-links">
                
                <p>Don't have an account? <a href="/pages/auth/signup/signup.html">Sign Up</a></p>
            </div>
        </div>

            
        </div>

    </div>
    <script src="/pages/auth/login/login.js"></script>
</body>
</html>
