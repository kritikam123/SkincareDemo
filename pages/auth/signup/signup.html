<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist | SignUp</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/pages/auth/signup/signup.css">


</head>
<body>
    <div class="signup_container">
        
        <div class="signup_box">
            <h1> Minimalist</h1>
             <p>Welcome! <br>Please enter your details to continue</p>
             
             <div id="message-box"></div>

            <form class="form" id="signupForm">
                <div class="name">
                <label>Full Name </label>
                <input type="text" id="name" required>
                <span class="error-text" id="nameError"></span>
                </div>
                <div class="email">
                <label>Email Address </label>
                <input type="email" id="email" required>
                <span class="error-text" id="emailError"></span>
                </div>
                <div class="number">
                <label>Phone Number </label>
                <input type="text" id="phone" required>
                <span class="error-text" id="phoneError"></span>
                </div>
                <div class="address">
                <label>Address</label>
                <input type="text" id="address" required>
                </div>
                <div class="password">
                <label>Password</label>
                <input type="password" id="password" required>
                <span class="error-text" id="passwordError"></span>
                </div>
                <div class="confirm_password">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" required>
                <span class="error-text" id="confirmPasswordError"></span>
                </div>
                <div class="box">
                <label>
                 <input type="checkbox" id="terms">
                I agree to the Terms of Service and Privacy Policy.
                </label>
                
                </div>
                <div class="button"> 
                <button type="submit" >Create Account</button>
                </div>
        
            </form>

            <div class="extra-links">
                
                <p>Already have an account? <a href="/pages/auth/login/login.html">Log In</a></p>
            </div>
        </div>

            
        </div>

    </div>
    <script src="/pages/auth/signup/signup.js"></script>
</body>
</html>
